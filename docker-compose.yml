version: '3.9'

services:
  api:
    build:
      context: .
      target: builder
    command: npm run dev
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_DRIVER: ${DB_DRIVER:-postgres}
      DATABASE_URL: postgresql://cms:cms_password@postgres:5432/cms_headless
      MONGODB_URI: mongodb://mongodb:27017/cms_headless
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-in-production-abc}
      JWT_EXPIRES_IN: 7d
      RATE_LIMIT_MAX: 1000
      CORS_ORIGIN: '*'
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cms-network
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms_password
      POSTGRES_DB: cms_headless
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/infrastructure/database/postgres/migrations/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cms -d cms_headless']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cms-network
  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: cms_headless
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cms-network
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cms.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - postgres
    profiles:
      - tools
    networks:
      - cms-network
  mongo-express:
    image: mongo-express:latest
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    ports:
      - '8081:8081'
    depends_on:
      - mongodb
    profiles:
      - tools
    networks:
      - cms-network

volumes:
  postgres_data:
  mongodb_data:

networks:
  cms-network:
    driver: bridge
